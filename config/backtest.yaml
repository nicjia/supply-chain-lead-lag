# Central defaults for backtest + grid scripts (override with CLI flags).
# Paths are relative to the repo root when you run scripts from there.

paths:
  returns_parquet: data/returns_with_gvkey.parquet
  edges_csv: data/merged_edges.csv

strategy:
  signal_method: supplier_pressure
  edge_date_col: filing_date
  edge_expiry_days: 550

# How each supply-chain edge is scored into C (see build_lead_lag_matrix_gvkey).
matrix:
  score: tstat_diff
  # Optional: α in [0,1] for main leg — α·C_data + (1−α)·C_supply (see hybrid_matrix). Try ~0.3–0.7 vs structural baseline.
  # hybrid_alpha: 0.5

ranking:
  rank_method: cluster_eigen
  # Must match grid when reproducing a cell (grid used --n_clusters 6).
  n_clusters: 4
  cluster_random_state: 0

backtest:
  max_rebalances: null
  # Realism controls (all optional; defaults preserve old behavior).
  commission_bps: 0.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
  # Risk overlays.
  max_abs_weight: null
  beta_neutralize: false
  beta_lookback_rows: 252
  market_gvkey: null
  sector_neutralize: false
  sector_map_csv: null

outputs:
  daily_csv: results/backtest/daily_strategy.csv
  summary_json: results/backtest/summary.json
  comparison_csv: results/backtest/summary_comparison.csv

# Used by scripts/grid_backtest.py when --config points here (section grid).
# rank_methods: list only what you want to sweep (cluster/cluster_eigen use n_clusters).
# Optional lists (omit = single value from ranking.n_clusters / backtest.max_rebalances):
#   n_clusters: [4, 6, 8]
#   max_rebalances: [8, 12]   # or include null for no cap (full history)
grid:
  scores: null
  rank_methods:
    - leadingness
    - spectral
    - cluster
    - cluster_eigen
  out_csv: results/backtest/grid_main.csv
