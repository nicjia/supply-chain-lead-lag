[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-lead-lag"
version = "0.2.0"
description = "Unified framework for network-based lead-lag: statistical vs supply-chain structure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "tqdm>=4.65",
  "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
panel = ["linearmodels>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["supply_chain_leadlag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
