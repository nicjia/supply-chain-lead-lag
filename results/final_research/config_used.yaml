paths:
  edges_csv: data/merged_edges.csv
  returns_parquet: data/returns_with_gvkey.parquet
  earnings_calendar_csv: data/output_earnings_calendar.csv
  sector_map_csv: data/sector_map.csv
  output_dir: results/final_research
pit:
  edge_date_col: filing_date
  edge_expiry_days: 550
  prefer_filing_date: true
matrix:
  lookback_rows: 504
  horizon: 1
  min_obs: 80
  max_lag: 5
  winsor_q: 0.001
  edge_score: tstat_diff
  edge_scores:
  - tstat_diff
  - beta_diff
  - cross_corr
  - regression_r2
  - granger
  - levy
  hybrid_alpha_grid:
  - 0.0
  - 0.25
  - 0.5
  - 0.75
  - 1.0
clustering:
  n_clusters: 10
  random_state: 42
  default_cluster_method: hermitian
  methods:
  - sector
  - supply_community
  - symmetric_spectral
  - hermitian
  - signed
  - hybrid_prior
  hybrid_prior_alpha: 0.5
strategies:
  families:
  - supplier_pressure
  - globalrank
  - metacluster
  - clusterrank
  q: 0.2
  rebalance_freq: BME
  max_rebalances: null
  apply_next_day: true
  globalrank_method: spectral
baselines:
  include: true
  methods:
  - random
  - momentum
  - structural
  - equal_weight
  momentum_window: 20
costs:
  commission_bps: 0.0
  slippage_bps: 0.0
  borrow_bps_annual: 0.0
risk:
  max_abs_weight: null
  beta_neutralize: false
  market_gvkey: null
  beta_lookback_rows: 252
  sector_neutralize: false
events:
  enabled: true
  earnings_window_days:
  - -1
  - 0
  - 1
  large_customer_return_quantile: 0.95
  high_vol_quantile: 0.8
report:
  generate_md: true
  generate_tex: true
  generate_pdf: false
  plot_profile: full
panel:
  horizon_max: 5
  build_if_missing: true
  forward_parquet: data/leadlag_panel_forward.parquet
  reverse_parquet: data/leadlag_panel_reverse.parquet
